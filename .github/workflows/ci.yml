name: InventAI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio
        
    - name: Run Tests
      run: |
        # In reality, this would loop through all services
        pytest services/innovation-engine/tests/
        
    - name: Build Docker Images
      run: |
        docker-compose -f docker/docker-compose.yml build
